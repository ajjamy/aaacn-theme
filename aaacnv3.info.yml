name: 'AAACN v3.0'
type: theme
description: 'AAACN subtheme based on Bootstrap 5 theme.'
core_version_requirement: '^8.9 || ^9 || ^10 || ^11'
'base theme': bootstrap5
libraries:
  - aaacnv3/global-styling
  - aaacnv3/global-scripts
stylesheets-remove:
  - '@bootstrap5/css/style.css'
ckeditor_stylesheets:
  - css/ckeditor.css
regions:
